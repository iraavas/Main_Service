services:
  database:
    image: postgres:16.1-alpine
    container_name: pg-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: module1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  main-service:
    image: iraavas/main-service
    container_name: spring-boot-app
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: module1
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_FLYWAY_ENABLED: true
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    networks:
      - app-network

  additional-service:
    image: iraavas/additional-service
    container_name: additional-service
    depends_on:
      - main-service
    ports:
      - "8082:8082"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
