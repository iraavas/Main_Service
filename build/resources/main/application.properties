spring.datasource.url=jdbc:postgresql://${DB_HOST:hl21.zil}:${DB_PORT:5432}/${DB_NAME:iraavas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# --- Flyway ---
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

# --- Swagger ---
server.port=${MAIN_SERVICE_PORT:8081}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

# --- ??????? (???? 10) ---
statistics.observability=${STATISTICS_OBSERVABILITY:true}
observability.intervals=${OBSERVABILITY_INTERVALS:10,30,60}
service.statistic.observability.delay=${SERVICE_STATISTIC_OBSERVABILITY_DELAY:5000}
